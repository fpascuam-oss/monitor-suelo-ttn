<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorización de Suelo - TTN (Dragino LSE01)</title>
    <!-- Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-temp: #e74c3c;
            --accent-hum: #3498db;
            --accent-cond: #f39c12;
            --accent-bat: #27ae60;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            border-bottom: 2px solid #e0e6ed;
            padding-bottom: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a252f;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #ccc;
        }

        .card.bat { border-top-color: var(--accent-bat); }
        .card.temp { border-top-color: var(--accent-temp); }
        .card.hum { border-top-color: var(--accent-hum); }
        .card.cond { border-top-color: var(--accent-cond); }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .card-unit {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
            height: 400px;
        }

        .error-msg {
            background-color: #fdecea;
            color: #c0392b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Sensor de Suelo <span id="device-id" style="color: #3498db;"></span></h1>
            <small id="last-update" style="color: var(--text-muted);">Cargando datos...</small>
        </div>
        <div class="status-bar">
            <button onclick="fetchTTNData()">Actualizar ahora</button>
        </div>
    </header>

    <div id="error-box" class="error-msg"></div>

    <!-- Tarjetas de última lectura -->
    <div class="cards-grid">
        <div class="card bat">
            <div class="card-title">Batería</div>
            <div class="card-value"><span id="val-bat">--</span> <span class="card-unit">V</span></div>
        </div>
        <div class="card temp">
            <div class="card-title">Temperatura del Suelo</div>
            <div class="card-value"><span id="val-temp">--</span> <span class="card-unit">°C</span></div>
        </div>
        <div class="card hum">
            <div class="card-title">Humedad del Suelo</div>
            <div class="card-value"><span id="val-hum">--</span> <span class="card-unit">%</span></div>
        </div>
        <div class="card cond">
            <div class="card-title">Conductividad (EC)</div>
            <div class="card-value"><span id="val-cond">--</span> <span class="card-unit">µS/cm</span></div>
        </div>
    </div>

    <!-- Gráfico histórico -->
    <div class="chart-container">
        <canvas id="soilChart"></canvas>
    </div>
</div>

<script>
    // Configuración de TTN
    const TTN_CONFIG = {
        url: "https://eu1.cloud.thethings.network/api/v3/as/applications/sesion-info/packages/storage/uplink_message?last=12h",
        token: "NNSXS.IAXCPSZDZUPKCPA43Y4SP7AC74XQMWP7ILYVQAA.SKUJVVKXNUBHEIWAME5KSFZFYH7WDS2F5IJQOWKSXPYIT6RKVZDA"
    };

    let soilChart = null;

    async function fetchTTNData() {
        const errorBox = document.getElementById('error-box');
        errorBox.style.display = 'none';

        try {
            const response = await fetch(TTN_CONFIG.url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${TTN_CONFIG.token}`,
                    'Accept': 'text/event-stream'
                }
            });

            if (!response.ok) {
                throw new Error(`Error HTTP ${response.status}: ${response.statusText}`);
            }

            const rawText = await response.text();
            const parsedRecords = parseTTNResponse(rawText);

            if (parsedRecords.length === 0) {
                throw new Error("No se encontraron mensajes en las últimas 12 horas.");
            }

            // Ordenar cronológicamente (del más antiguo al más reciente)
            parsedRecords.sort((a, b) => new Date(a.received_at) - new Date(b.received_at));

            // Quedarnos con las últimas 10 medidas
            const last10 = parsedRecords.slice(-10);

            updateDashboard(last10);

        } catch (err) {
            console.error(err);
            errorBox.textContent = `Error al obtener datos de TTN: ${err.message}`;
            errorBox.style.display = 'block';
        }
    }

    // Parseador compatible con NDJSON de TTN ({"result": {...}}) y arrays JSON estándar
    function parseTTNResponse(rawText) {
        const trimmed = rawText.trim();
        if (!trimmed) return [];

        // Si es un array JSON estándar (como el archivo de ejemplo)
        if (trimmed.startsWith('[')) {
            const arr = JSON.parse(trimmed);
            return arr.map(item => item.result ? item.result : item);
        }

        // Si es respuesta streaming/NDJSON línea por línea de la API Storage
        const lines = trimmed.split('\n');
        const records = [];
        for (const line of lines) {
            if (!line.trim()) continue;
            try {
                const obj = JSON.parse(line);
                records.push(obj.result ? obj.result : obj);
            } catch (e) {
                console.warn("Línea ignorada al parsear:", line);
            }
        }
        return records;
    }

    function updateDashboard(records) {
        // El último elemento es la medida más reciente
        const latest = records[records.length - 1];
        const payload = latest.uplink_message.decoded_payload;

        // Actualizar cabecera
        document.getElementById('device-id').textContent = `(${latest.end_device_ids.device_id})`;
        const dateObj = new Date(latest.received_at);
        document.getElementById('last-update').textContent = `Última medida recibida: ${dateObj.toLocaleString('es-ES')}`;

        // Actualizar tarjetas (convertimos strings a float por seguridad)
        document.getElementById('val-bat').textContent = parseFloat(payload.Bat).toFixed(2);
        document.getElementById('val-temp').textContent = parseFloat(payload.temp_SOIL).toFixed(2);
        document.getElementById('val-hum').textContent = parseFloat(payload.water_SOIL).toFixed(2);
        document.getElementById('val-cond').textContent = parseInt(payload.conduct_SOIL, 10);

        // Preparar datos para el gráfico (últimas 10 medidas)
        const labels = records.map(r => {
            const d = new Date(r.received_at);
            return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        });

        const tempData = records.map(r => parseFloat(r.uplink_message.decoded_payload.temp_SOIL));
        const humData = records.map(r => parseFloat(r.uplink_message.decoded_payload.water_SOIL));
        const condData = records.map(r => parseInt(r.uplink_message.decoded_payload.conduct_SOIL, 10));

        renderChart(labels, tempData, humData, condData);
    }

    function renderChart(labels, tempData, humData, condData) {
        const ctx = document.getElementById('soilChart').getContext('2d');

        if (soilChart) {
            soilChart.destroy();
        }

        soilChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: tempData,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        yAxisID: 'y',
                        tension: 0.3,
                        fill: false
                    },
                    {
                        label: 'Humedad (%)',
                        data: humData,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        yAxisID: 'y',
                        tension: 0.3,
                        fill: false
                    },
                    {
                        label: 'Conductividad (µS/cm)',
                        data: condData,
                        borderColor: '#f39c12',
                        backgroundColor: 'rgba(243, 156, 18, 0.1)',
                        yAxisID: 'y1',
                        tension: 0.3,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Histórico de las últimas 10 medidas'
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Temp (°C) / Humedad (%)'
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Conductividad (µS/cm)'
                        },
                        grid: {
                            drawOnChartArea: false, // Evita solapar líneas de cuadrícula
                        }
                    }
                }
            }
        });
    }

    // Cargar datos al abrir la página y refrescar automáticamente cada 5 minutos
    fetchTTNData();
    setInterval(fetchTTNData, 300000);
</script>

</body>
</html>
